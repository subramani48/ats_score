name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ats_test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'ATS score /backend/package-lock.json'

      - name: Install backend dependencies
        run: npm ci --legacy-peer-deps
        working-directory: 'ATS score /backend'

      - name: Generate Prisma client
        run: npm run db:generate
        working-directory: 'ATS score /backend'

      - name: TypeScript check
        run: npm run typecheck
        working-directory: 'ATS score /backend'

      - name: Unit tests
        run: npm test -- --runInBand
        working-directory: 'ATS score /backend'

      - name: Build
        run: npm run build
        working-directory: 'ATS score /backend'

      - name: Push schema to test DB
        run: npx prisma db push
        working-directory: 'ATS score /backend'
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/ats_test

    env:
      DATABASE_URL: postgresql://postgres:test@localhost:5432/ats_test
      GEMINI_API_KEY: test_key_ci
      SMTP_HOST: smtp.ethereal.email
      SMTP_PORT: 587
      SMTP_USER: test@test.com
      SMTP_PASS: test
      JWT_SECRET: ci-test-secret-32-characters-long!
      NODE_ENV: test

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'ATS score /frontend/package-lock.json'

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps
        working-directory: 'ATS score /frontend'

      - name: Lint
        run: npm run lint
        working-directory: 'ATS score /frontend'

      - name: TypeScript check
        run: npm run typecheck
        working-directory: 'ATS score /frontend'

      - name: Build
        run: npm run build
        working-directory: 'ATS score /frontend'
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000
